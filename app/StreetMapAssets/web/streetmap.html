<!doctype html>
<!-- PrepareMe's street map (plan phase 9; the web engine, owner 2026-10-14): the page the phone's Maps tab and the
     Mac's Street map window show, every file served by the app itself (prepareme-map://), nothing online. The app
     drives it through streetmap.js's `pm` and hears back through the "map" message handler. -->
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="maplibre-gl.css">
<style>
html, body, #map { margin: 0; height: 100%; width: 100%; background: #e2dfda; }
@media (prefers-color-scheme: dark) { html, body, #map { background: #34373d; } }
.maplibregl-ctrl-attrib { font: 11px -apple-system, sans-serif; }
</style>
<script src="pmtiles.js"></script>
<script src="stack.js"></script>
</head><body><div id="map"></div>
<script type="module" src="streetmap.js"></script>
</body></html>
